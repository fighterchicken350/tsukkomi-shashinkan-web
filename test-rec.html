<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rec-row test</title><style>:root{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* layout concept: バラエティ番組のスタジオ。中央にポラロイド写真、言葉は手書き→テロップ→ステッカーになってボケへ飛ぶ */
:root{
  --ink:#0d0f1f; --card:#1d2147; --line:#353b78; --text:#f6f4ff; --muted:#a8add9;
  --yellow:#ffe14a; --pink:#ff3d6e; --cyan:#3fd8ff; --paper:#f6f1e7;
  --f-disp:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --f-hand:'Yusei Magic','Hiragino Maru Gothic ProN','Yu Gothic',cursive;
  --f-body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink)}
body{
  margin:0;color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:14px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--ink);
  background-image:radial-gradient(ellipse 80% 40% at 50% -5%,#303577 0,transparent 70%),radial-gradient(rgba(255,255,255,.055) 1.3px,transparent 1.6px);
  background-size:auto,18px 18px;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.telop{font-family:var(--f-disp);color:#fff;-webkit-text-stroke:var(--sw,6px) var(--stroke,var(--pink));paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.35);line-height:1.18;text-align:center;letter-spacing:.02em;text-wrap:balance;margin:0;font-weight:400}
.huge{font-size:clamp(46px,15vw,88px);--sw:13px}
.hero{position:relative;isolation:isolate;border-radius:20px;overflow:hidden;margin:0 0 16px;background:#14163a center/cover;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,34,.42),rgba(10,12,34,.34) 55%,rgba(10,12,34,.5))}
.hero-logo{position:relative;z-index:1;display:block;width:100%;height:auto;mix-blend-mode:screen;filter:drop-shadow(0 6px 16px rgba(0,0,0,.8)) drop-shadow(0 0 26px rgba(0,0,0,.55)) saturate(1.15)}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:700}
.lead{font-size:16px;line-height:1.75;text-align:center;margin:0}
.btn{border:0;border-radius:14px;background:var(--yellow);color:#14163a;font-family:var(--f-disp);font-size:22px;padding:14px 22px;box-shadow:0 6px 0 #b8941a;letter-spacing:.06em;min-height:56px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8941a}
.btn:disabled{opacity:.55;box-shadow:none;transform:none}
.btn.alt{background:var(--card);color:var(--text);box-shadow:0 4px 0 #080a1a;border:1px solid var(--line);font-size:14px;font-family:var(--f-body);font-weight:700;min-height:44px;padding:8px 16px}
.btn.alt:active{box-shadow:0 1px 0 #080a1a}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* title */
#v-title,#v-result{display:flex;flex-direction:column;gap:18px}
#v-title{position:relative;overflow:hidden}
.float-words{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.float-words i{position:absolute;font-family:var(--f-disp);color:rgba(255,255,255,.08);white-space:nowrap;animation:floatup 16s linear infinite}
@keyframes floatup{from{transform:translateY(105%) rotate(-4deg)}to{transform:translateY(-25vh) rotate(3deg)}}
#v-title>:not(.float-words){position:relative;z-index:1}
.btn.pulse{animation:btnpulse 1.6s ease-in-out infinite}
@keyframes btnpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.steps{list-style:none;counter-reset:s;display:grid;gap:10px;padding:0;margin:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.steps li::before{content:counter(s);font-family:var(--f-disp);background:var(--yellow);color:#14163a;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;grid-row:1/3}
.steps b{font-size:16px}
.steps span{color:var(--muted);font-size:13.5px;line-height:1.6}
.opts{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center}
.opt{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.opt input{width:20px;height:20px;accent-color:var(--pink)}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:0;line-height:1.6}
.best{text-align:center;color:var(--yellow);font-weight:700;font-size:13px}

/* play */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.score{font-family:var(--f-disp);font-size:36px;color:var(--yellow);-webkit-text-stroke:5px #14163a;paint-order:stroke fill;font-variant-numeric:tabular-nums;line-height:1}
.score.pop{animation:popn .35s}
@keyframes popn{40%{transform:scale(1.35)}}
.combo{font-family:var(--f-disp);font-size:18px;color:#fff;-webkit-text-stroke:5px var(--pink);paint-order:stroke fill;animation:popn .4s}
.bar{height:10px;border-radius:99px;background:#262b5a;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3fd8ff,#ffe14a);transform-origin:left}
.bar.low i{background:var(--pink)}
.frame{position:relative;background:var(--paper);padding:10px 10px 38px;border-radius:4px;box-shadow:0 20px 40px rgba(0,0,0,.55);transform:rotate(-1.2deg);margin:8px auto 0;width:100%;max-width:min(100%,calc(44vh*1.3333 + 20px));position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20}
.frame::before{content:"";position:absolute;left:50%;top:-13px;width:96px;height:26px;background:rgba(255,226,120,.78);transform:translateX(-50%) rotate(-3deg);z-index:5}
.frame.drop{animation:drop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:rotate(5deg) scale(1.28) translateY(-30px);opacity:0}to{transform:rotate(-1.2deg);opacity:1}}
.photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:#222;max-width:100%}
.photo::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35));pointer-events:none}
.photo.shake{animation:shake .32s}
.photo.punch{animation:punch .42s}
@keyframes punch{25%{transform:scale(1.045) rotate(.7deg)}55%{transform:scale(.985) rotate(-.3deg)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
#sceneBox{position:absolute;inset:0}
#sceneBox svg,#sceneBox img{width:100%;height:100%;display:block;object-fit:cover}
.marks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.mk{fill:none;stroke:#ff2e63;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.mk.draw{animation:draw .55s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rv{fill:none;stroke:var(--yellow);stroke-width:5;stroke-dasharray:14 10}
.rvt{font-family:'Dela Gothic One',sans-serif;font-size:30px;fill:#ffe14a;stroke:#14163a;stroke-width:7;paint-order:stroke;text-anchor:middle}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3}
#live{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);max-width:92%;width:max-content;font-family:var(--f-hand);font-size:clamp(22px,6.2vw,34px);color:#fff;background:rgba(12,14,36,.62);padding:.1em .5em .15em;border-radius:8px;white-space:pre-wrap;word-break:break-all;text-align:center;line-height:1.35;-webkit-text-stroke:0}
#live::after{content:"";display:inline-block;width:.1em;height:1em;background:var(--yellow);margin-left:3px;vertical-align:-.12em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ch{display:inline-block;transform:translateY(var(--y,0)) rotate(var(--r,0))}
.ch.new{animation:write .22s ease-out both}
@keyframes write{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
#banner{position:absolute;left:50%;top:40%;z-index:4;font-size:clamp(28px,9vw,54px);--sw:10px;pointer-events:none;opacity:0;white-space:nowrap}
#banner.show{animation:banner 1.3s forwards}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(2.3) rotate(-6deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9) rotate(-6deg)}}
.cap{position:absolute;left:14px;right:14px;bottom:7px;display:flex;justify-content:space-between;align-items:center;color:#2a2438;font-family:var(--f-hand);font-size:17px}
.dots i{display:inline-block;width:13px;height:13px;border-radius:50%;border:2.5px solid #c2185b;margin-left:5px;vertical-align:-1px}
.dots i.on{background:#e91e63}

.sticker{position:absolute;left:0;top:0;display:grid;place-items:center;will-change:transform}
.sticker>*{grid-area:1/1}
.sticker .burst{overflow:visible}
.sticker .b0{fill:rgba(0,0,0,.35)}
.sticker .b1{fill:var(--bf,#fff);stroke:#14163a;stroke-width:5;stroke-linejoin:round}
.sticker .txt{position:relative;z-index:2;word-break:break-all}
.sticker .mark{position:absolute;right:-4px;top:-14px;width:46px;height:46px;z-index:3}
.sticker .badge{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%) rotate(-3deg);font-family:var(--f-disp);background:#14163a;color:var(--yellow);border:2px solid var(--yellow);border-radius:99px;padding:1px 12px;font-size:15px;white-space:nowrap;z-index:3}
.sticker.flash .b1{animation:flash .3s}
@keyframes flash{50%{fill:#fff}}
.ring{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:8px solid var(--c,#fff);animation:ring .5s ease-out forwards}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(5.5);opacity:0}}
.flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flashfade .32s ease-out}
@keyframes flashfade{0%{opacity:.5}100%{opacity:0}}
.speedline{position:absolute;width:64px;height:4px;margin:-2px 0 0 -32px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95));pointer-events:none}
.confetti{position:absolute;width:10px;height:14px;pointer-events:none}
.ink{position:absolute;border-radius:50%;animation:ink .6s ease-out forwards}
@keyframes ink{from{transform:scale(1);opacity:.9}to{transform:scale(.1);opacity:0}}
.spark{position:absolute;width:14px;height:14px;margin:-7px;background:var(--c);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.pts{position:absolute;font-family:var(--f-disp);font-size:46px;color:var(--yellow);-webkit-text-stroke:7px #14163a;paint-order:stroke fill;white-space:nowrap;animation:pts 1.2s ease-out forwards}
.pts.sm{font-size:24px;color:#fff}
.pts.big{font-size:66px;color:#ffe14a}
@keyframes pts{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}20%{opacity:1;transform:translate(-50%,-70%) scale(1.45)}100%{transform:translate(-50%,-180%) scale(1);opacity:0}}

.ctl{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;margin-top:18px;position:relative;z-index:30}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:#4a4f78;box-shadow:0 6px 0 #2c3050;display:grid;place-items:center;color:#cfd3ff;flex:none}
.mic:active{transform:translateY(3px);box-shadow:0 3px 0 #2c3050}
.mic[data-s="listening"]{background:#ff2d2d;color:#fff;box-shadow:0 6px 0 #a30f0f,0 0 28px 6px rgba(255,45,45,.6);animation:pulse 1.1s infinite}
@keyframes pulse{0%{outline:0 solid rgba(255,45,45,.6)}70%{outline:18px solid rgba(255,45,45,0)}100%{outline:0 solid rgba(255,45,45,0)}}
.mic[data-s="starting"]{background:#ffb020;color:#14163a;box-shadow:0 6px 0 #b57a00}
.micl{font-weight:700;font-size:15px;line-height:1.5}
.vol{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.vol span{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.volbar{flex:1;height:10px;border-radius:99px;background:#262b5a;overflow:hidden}
.volbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#3fd8ff,#ffe14a,#ff3d6e);transition:width .09s linear}
.row{display:flex;gap:8px;grid-column:1/-1;min-width:0}
.row input{flex:1;min-width:0;border-radius:12px;border:2px solid var(--line);background:#12153a;padding:10px 14px;font-size:16px;font-family:var(--f-body)}
.row input::placeholder{color:#7c82b8}
.row .btn{font-size:17px;padding:10px 16px;min-height:48px;box-shadow:0 4px 0 #b8941a;white-space:nowrap}
#micNote{grid-column:1/-1;text-align:left}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.log .t{font-weight:700;word-break:break-all;min-width:0}
.log .p{font-family:var(--f-disp);color:var(--yellow);text-align:right;font-variant-numeric:tabular-nums}
.log .c{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
#between{align-items:center;text-align:center}
#between h2{font-size:30px;--sw:8px}
.miss{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px;color:var(--muted);text-align:left}
.miss li::before{content:"見逃し  ";color:var(--yellow);font-weight:700}
.big{font-size:clamp(54px,18vw,96px);--sw:12px}
.rank{font-family:var(--f-disp);font-size:22px;color:var(--yellow);text-align:center;margin:0}
.top{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:t}
.top li{counter-increment:t;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;font-size:14px}
.top li::before{content:counter(t);font-family:var(--f-disp);color:var(--yellow);text-align:center}
#scoreCard{position:absolute;left:50%;top:3%;z-index:5;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(10,12,30,.8);border:2px solid var(--yellow);border-radius:14px;padding:4px 12px 8px;opacity:0;pointer-events:none}
#scoreCard.show{animation:card 2.4s forwards}
@keyframes card{0%{opacity:0;transform:translateX(-50%) scale(.5)}12%{opacity:1;transform:translateX(-50%) scale(1.12)}22%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(.95)}}
#scoreCard .g{font-family:var(--f-disp);color:var(--yellow);font-size:15px;letter-spacing:.1em}
#scoreCard .num{font-size:clamp(40px,13vw,66px);--sw:9px;line-height:1}
#scoreCard .num small{font-size:.38em;margin-left:3px;-webkit-text-stroke:0;text-shadow:none;color:var(--muted)}
#scoreCard .cols{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px;justify-content:center}
#scoreCard .col{display:grid;justify-items:center;gap:2px;font-size:10.5px;line-height:1.2}
#scoreCard .col.bonus b{color:var(--yellow)}
#scoreCard .col i{display:block;width:34px;height:6px;border-radius:3px;background:#2a2f63;position:relative;overflow:hidden}
#scoreCard .col i::after{content:"";position:absolute;inset:0;width:var(--h);background:var(--cyan)}
#scoreCard .col b{font-weight:700;color:var(--muted)}
#scoreCard .col span{font-variant-numeric:tabular-nums;color:#fff;font-weight:700}
.rec-row{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid #2a2f63}
.rec-row:last-child{border-bottom:0}
.rec-row audio{width:100%;height:36px}
.rec-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rec-head b{font-weight:700;word-break:break-all}
.rec-head span{font-family:var(--f-disp);color:var(--yellow);white-space:nowrap}
.rec-btns{display:flex;gap:8px;align-items:center}
.rec-btns .btn{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 12px;font-size:14px;white-space:nowrap;text-align:center;text-decoration:none}
details.card summary{cursor:pointer;font-weight:700}
.wrow{display:grid;grid-template-columns:62px 1fr 52px;gap:10px;align-items:center;font-size:14px}
.wrow input{width:100%;accent-color:var(--pink);min-width:0}
.wv{text-align:right;font-variant-numeric:tabular-nums;color:var(--yellow);font-weight:700}

/* インタースティシャル広告（1ゲーム終了ごとに1回） */
#adModal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(8,10,26,.82);padding:20px}
#adModal[hidden]{display:none!important}
.ad-box{position:relative;width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.ad-tag{position:absolute;top:10px;left:12px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.ad-close{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#14163a;color:var(--text);font-size:20px;line-height:1}
.ad-close:disabled{opacity:.45;cursor:not-allowed}
.ad-promo{margin:22px 0 8px;font-family:var(--f-disp);font-size:26px;color:var(--yellow)}
.ad-note{font-size:12.5px;color:var(--muted);margin:0}

/* バナー広告（プレイ画面の下部に常時表示・320×50） */
#v-play{padding-bottom:76px}
#adBanner{position:sticky;bottom:0;z-index:6;display:flex;justify-content:center;padding:6px 0 8px;background:linear-gradient(to bottom,rgba(10,12,30,0),var(--bg) 35%)}
#adBanner .ad-slot{position:relative;width:100%;max-width:320px;height:50px;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#adBanner .ad-tag{position:absolute;top:3px;left:6px;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--card)}
#adBanner .ad-note{font-size:12.5px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.frame.drop,.photo.shake,.photo.punch,.mic[data-s="listening"]{animation:none}}
</style></head>
<body><div class="wrap"><section id="v-result"><div class="card"><p class="eyebrow">録音したツッコミ</p>
<ol id="rRec">
<li class="rec-row"><div class="rec-head"><b>なんでやねん！</b><span>+320点</span></div><audio controls preload="none"></audio><div class="rec-btns"><button class="btn alt" type="button">共有する</button><a class="btn alt">保存する</a></div></li>
<li class="rec-row"><div class="rec-head"><b>この文章がお茶の上に載ってるやんけ！どうなってんねん！</b><span>+580点</span></div><audio controls preload="none"></audio><div class="rec-btns"><button class="btn alt" type="button">共有する</button><a class="btn alt">保存する</a></div></li>
</ol></div></section></div></body></html>
